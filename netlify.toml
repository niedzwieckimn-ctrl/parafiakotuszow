[build]
  command = "node build.mjs"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["sharp"]

[[headers]]
  for = "/admin/*"
  [headers.values]
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'"

[[redirects]]
  from = "/api/slowo-na-dzis/v3"
  to = "/.netlify/functions/daily-word"
  status = 200

[[redirects]]
  from = "/api/slowo-na-dzis/v2"
  to = "/.netlify/functions/daily-word"
  status = 200

[[redirects]]
  from = "/api/slowo-na-dzis"
  to = "/.netlify/functions/daily-word"
  status = 200

[[redirects]]
  from = "/api/aktualnosci"
  to = "/.netlify/functions/news"
  status = 200

[[redirects]]
  from = "/api/intencje"
  to = "/.netlify/functions/intentions"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
